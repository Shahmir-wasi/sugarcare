<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SugarCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <img src="images/logo.png" alt="SugarCare Logo">
                    <h1>Sugar<span>Care</span></h1>
                </div>
                <h2>Login to Your Account</h2>
            </div>
            <div class="auth-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <label for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn primary-btn btn-block">Login</button>
                </form>
                <div class="auth-divider">
                    <span>or</span>
                </div>
                <div class="social-login">
                    <button class="btn social-btn google-btn">
                        <i class="fab fa-google"></i> Login with Google
                    </button>
                    <button class="btn social-btn facebook-btn">
                        <i class="fab fa-facebook-f"></i> Login with Facebook
                    </button>
                </div>
                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Register</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
